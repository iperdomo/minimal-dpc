name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      # The runner image ships the Android SDK with licences already accepted,
      # so AGP fetches compileSdk 35 itself if the image does not have it.
      - run: ./gradlew assembleDebug --no-daemon
