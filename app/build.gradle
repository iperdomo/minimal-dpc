plugins {
    id 'com.android.application'
}

// Release signing material lives in keystore.properties (gitignored) so the
// passwords never enter git. Absent it, assembleRelease falls back to the
// debug key - fine for a local smoke test, never for a device you hand over.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'me.perdomo.dpc'
    compileSdk 35

    defaultConfig {
        applicationId "me.perdomo.dpc"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        // Policy consults BuildConfig.DEBUG to decide whether to apply the
        // restrictions in Policy.DEBUG_SKIPPED_RESTRICTIONS. AGP 8 does not
        // generate BuildConfig unless asked.
        buildConfig true
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // Exists so there is a build you can keep adb attached to. It is
            // the same applicationId and the same AdminReceiver, so every dpm
            // command in the README works unchanged - the only difference is
            // that DISALLOW_DEBUGGING_FEATURES is not applied.
            //
            // Never hand this build to anyone: it leaves adb reachable, which
            // is a shell with device-owner-adjacent reach on a locked device.
            minifyEnabled false
        }

        release {
            // The provisioning QR pins this certificate, so changing the key later
            // invalidates every QR code already in circulation.
            signingConfig keystorePropertiesFile.exists()
                    ? signingConfigs.release
                    : signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Intentionally none. Everything used here is in the Android framework.
}
